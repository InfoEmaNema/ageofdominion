function enemyAttack(a,d){let A=stats(a),D=stats(d);showModal(`<h2>COMBAT PREVIEW</h2><p><b>${a.name}</b> attacks <b>${d.name}</b></p><div class="row"><span>Attacker strength</span><b>${A.attack}</b></div><div class="row"><span>Defender strength</span><b>${D.defense}</b></div><p>Terrain and formation modify defense. Combat has a small random factor.</p><div class="dialog-actions"><button data-close>CANCEL</button><button id="attack-confirm">ATTACK</button></div>`);document.querySelector('[data-close]').onclick=closeModal;$('attack-confirm').onclick=()=>{let res=attackArmy(s,a,d);log(s,`${res.win?'Victory':'Defeat'} in battle. ${res.damage} damage inflicted.`);closeModal();moves=[];redraw()}}
function citySiege(a,c){showModal(`<h2>ASSAULT ${c.name.toUpperCase()}</h2><p><b>Siege defenses: ${c.siege}/100</b></p><div class="bar siege-preview"><i style="width:${c.siege}%"></i></div><p>Your army will deal 25 siege damage. Four successful assaults break the defenses and capture this city. The assault is confirmed manually.</p><div class="dialog-actions"><button data-close>CANCEL</button><button id="siege-go">ATTACK CITY</button></div>`);document.querySelector('[data-close]').onclick=closeModal;$('siege-go').onclick=()=>{c.siege=Math.max(0,c.siege-25);a.moves=0;log(s,`Siege at ${c.name}: ${c.siege}/100.`);if(c.siege===0){let old=empire(s,c.owner);old.cities=old.cities.filter(x=>x!==c);c.owner=s.player;empire(s).cities.push(c);c.siege=100;log(s,`${c.name} has been captured!`)}closeModal();toast(c.owner===s.player?'City captured!':`Siege progress: ${c.siege}/100`);redraw()}}
function clickWorld(ev){if(!s||!$('modal').classList.contains('hidden'))return;let h=renderer.locate(s,ev.clientX,ev.clientY);if(!h)return;let e=empire(s),enemy=armyAt(s,h.q,h.r),friendly=e.armies.find(a=>a.q===h.q&&a.r===h.r),city=cityAt(s,h.q,h.r),settler=e.settlers.find(u=>u.q===h.q&&u.r===h.r);if(enemy&&enemy.owner!==e.id){let a=s.selected?.type==='army'?e.armies.find(x=>x.id===s.selected.id):null;if(a&&dist(a,enemy)===1&&a.moves>0)enemyAttack(a,enemy);else toast('Select an adjacent army with movement remaining to attack.');return}if(city&&city.owner!==e.id){let a=s.selected?.type==='army'?e.armies.find(x=>x.id===s.selected.id):null;if(a&&dist(a,city)===1&&a.moves>0)citySiege(a,city);else{s.selectedHex=h;toast('Enemy city. Move an army adjacent to begin a siege.')}return}if(s.selected?.type==='army'&&moves.some(m=>m.q===h.q&&m.r===h.r)){let a=e.armies.find(a=>a.id===s.selected.id),settlerOwner=s.empires.find(x=>x.settlers.some(u=>u.q===h.q&&u.r===h.r));if(settlerOwner&&a.units.length>=6){toast('This army is full and cannot recruit the settler.');return}moveArmy(s,a,h.q,h.r);if(settlerOwner)toast('Settler recruited into the army as a civilian escort.');moves=[];redraw();return}if(s.selected?.type==='settler'&&moves.some(m=>m.q===h.q&&m.r===h.r)){let u=e.settlers.find(x=>x.id===s.selected.id);if(u){u.q=h.q;u.r=h.r;u.moves=Math.max(0,(u.moves??1)-1);s.selected.q=h.q;s.selected.r=h.r;}moves=[];redraw();return}if(friendly){s.selected={type:'army',id:friendly.id};moves=validMoves(s,friendly)}else if(city&&city.owner===e.id){s.selected={type:'city',id:city.id};moves=[]}else if(settler){s.selected={type:'settler',...settler};moves=(settler.moves??1)>0?neighbors(settler).map(p=>({q:p.q,r:p.r})).filter(p=>{let t=getCell(s.map,p.q,p.r);return t&&t.terrain!=='water'&&t.terrain!=='mountain'&&!armyAt(s,p.q,p.r)&&!cityAt(s,p.q,p.r)}):[]}else{s.selectedHex=h;moves=[];s.selected=null}redraw()}
canvas.addEventListener('mousedown',ev=>{if(ev.button===0||ev.button===1||ev.button===2)drag={x:ev.clientX,y:ev.clientY,camX:s?.camera.x||0,camY:s?.camera.y||0,moved:false}});canvas.addEventListener('mousemove',ev=>{if(drag&&s){let dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;s.camera.x=drag.camX+dx;s.camera.y=drag.camY+dy;redraw()}});canvas.addEventListener('mouseup',ev=>{if(drag){if(!drag.moved&&ev.button===0)clickWorld(ev);drag=null;return}if(ev.button===0)clickWorld(ev)});canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('wheel',ev=>{if(s){s.camera.zoom=Math.max(.55,Math.min(1.65,s.camera.zoom*(ev.deltaY<0?1.1:.9)));redraw()}},{passive:true});
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('modal').classList.contains('hidden'))closeModal();else $('context').classList.add('hidden');return}if(!$('modal').classList.contains('hidden'))return;if(!s)return;let step=+(storageGet('age-dom-speed','32'));if(['w','a','s','d','W','A','S','D'].includes(ev.key)){if(ev.key.toLowerCase()==='w')s.camera.y+=step;if(ev.key.toLowerCase()==='s')s.camera.y-=step;if(ev.key.toLowerCase()==='a')s.camera.x+=step;if(ev.key.toLowerCase()==='d')s.camera.x-=step;redraw()}if(ev.key==='+'||ev.key==='='){s.camera.zoom=Math.min(1.65,s.camera.zoom*1.1);redraw()}if(ev.key==='-'){s.camera.zoom=Math.max(.55,s.camera.zoom*.9);redraw()}if(ev.key===' ')centerSelected();if(ev.key==='Enter')hitAction('end-turn');if(ev.key==='1')$('empire').click();if(ev.key==='2')$('technology').click();if(ev.key==='3')$('diplomacy').click();if(ev.key==='4')$('armies').click()});
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.action==='close-panel'){$('context').classList.add('hidden');return}if(b.dataset.action==='music'){music.toggle().then(on=>{window.musicEnabled=on;document.querySelectorAll('[data-music-toggle]').forEach(x=>{x.textContent=on?'MUSIC: ON':'MUSIC: OFF';x.classList.toggle('music-on',on)})});return}if(b.dataset.screen==='new')openEmpireSelect(start);if(b.dataset.screen==='how'||b.dataset.action==='how')openHow();if(b.dataset.screen==='options'){showModal(`<h2>OPTIONS</h2><label>CAMERA SPEED <select id="camera-speed"><option value="24">Slow</option><option value="32">Normal</option><option value="48">Fast</option></select></label><p>Mouse wheel controls zoom. Campaigns save in browser storage when you choose Save.</p><div class="dialog-actions"><button data-close>CLOSE</button></div>`);let speed=storageGet('age-dom-speed','32');document.querySelector('#camera-speed').value=speed;document.querySelector('#camera-speed').onchange=ev=>storageSet('age-dom-speed',ev.target.value);document.querySelector('[data-close]').onclick=closeModal;}if(b.dataset.action==='continue'){let loaded=load();if(loaded){s=loaded;document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));redraw();toast('Campaign resumed.')}else toast('No saved campaign found.')}if(b.dataset.action&&['save','end-turn','fortify','formation','split','heal','disband','center','found','specialize','settler','warrior','archer','merge','remove-unit'].includes(b.dataset.action))hitAction(b.dataset.action);if(b.dataset.build){let c=empire(s).cities.find(c=>c.id===s.selected.id),build=BUILDINGS.find(x=>x.name===b.dataset.build);if(c&&empire(s).resources.production>=build.cost){empire(s).resources.production-=build.cost;c.queue=build.name;toast(`${build.name} entered the build queue.`);redraw()}}if(b.dataset.panel==='technology')openTech(s,redraw);if(b.dataset.panel==='empire')showPanel('empire');if(b.dataset.panel==='diplomacy')showPanel('diplomacy');if(b.dataset.panel==='armies')showPanel('armies');if(b.dataset.close==='')closeModal()});
function showPanel(type){let e=empire(s);if(type==='empire')showModal(`<h2>${e.civ.name}</h2><p>Leader: ${e.civ.leader}. ${e.civ.desc}</p><div class="row"><span>Cities</span><b>${e.cities.length}</b></div><div class="row"><span>Armies</span><b>${e.armies.length}</b></div><p>${e.civ.bonus}</p><p>${e.civ.ability}</p><h3>CHRONICLE</h3><div class="log">${s.log.slice(0,12).map(x=>`<div>${x}</div>`).join('')}</div><div class="dialog-actions"><button data-close>CLOSE</button></div>`);if(type==='armies')showModal(`<h2>ARMY OVERVIEW</h2>${e.armies.map(a=>`<div class="row"><span>${a.name} · ${a.units.length} units · ${a.formation}</span><button data-army="${a.id}">SELECT</button></div>`).join('')||'<p>No armies.</p>'}<div class="dialog-actions"><button data-close>CLOSE</button></div>`);if(type==='diplomacy')showModal(`<h2>DIPLOMACY</h2>${s.empires.slice(1).map(x=>`<h3 style="color:${x.color}">${x.civ.name}</h3><p>${x.war.player?'AT WAR':x.relations.player>30?'Friendly':x.relations.player< -30?'Hostile':'Neutral'} · relation ${x.relations.player||0}</p><div class="actions"><button data-dip="gift" data-target="${x.id}">GIFT 10 GOLD</button><button data-dip="war" data-target="${x.id}">${x.war.player?'OFFER PEACE':'DECLARE WAR'}</button></div>`).join('')}<div class="dialog-actions"><button data-close>CLOSE</button></div>`);document.querySelector('[data-close]').onclick=closeModal;document.querySelectorAll('[data-army]').forEach(b=>b.onclick=()=>{s.selected={type:'army',id:+b.dataset.army};moves=validMoves(s,e.armies.find(a=>a.id===s.selected.id));closeModal();redraw()});document.querySelectorAll('[data-dip]').forEach(b=>b.onclick=()=>{let x=empire(s,b.dataset.target);if(b.dataset.dip==='gift'){if(e.resources.gold<10)return toast('Not enough Gold.');e.resources.gold-=10;x.relations.player=(x.relations.player||0)+(e.civ.id==='merchant'?20:12);toast('The gift improves relations.')}else{x.war.player=!x.war.player;e.war[x.id]=x.war.player;x.relations.player=x.war.player?-100:0;log(s,x.war.player?`War declared on ${x.civ.name}.`:`Peace offered to ${x.civ.name}.`)}closeModal();redraw()})}
function victory(){showModal(`<h2>${s.victory.toUpperCase()} VICTORY</h2><p>The Age of Dominion turns in your favor. Your realm will be remembered.</p><div class="dialog-actions"><button id="victory-close">RETURN TO REALM</button></div>`);$('victory-close').onclick=closeModal}
redraw();
return {};
})();
})();

</script></body></html>
